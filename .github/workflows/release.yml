name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Create release PR or publish packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up trusted publishing-compatible npm
        run: npm install --global npm@11 && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release pull request or publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          pr-draft: create
          create-github-releases: false
          push-git-tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create package GitHub releases
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: node .github/scripts/create-package-releases.mjs

      - name: Delete merged Changesets release branch
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BRANCH: changeset-release/main
        run: |
          if ! git ls-remote --exit-code --heads origin "$RELEASE_BRANCH"; then
            echo "Release branch is already absent."
            exit 0
          fi

          merged_prs=$(gh pr list --head "$RELEASE_BRANCH" --base main --state merged --json number --jq 'length')
          open_prs=$(gh pr list --head "$RELEASE_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$merged_prs" -gt 0 ] && [ "$open_prs" -eq 0 ]; then
            git push origin --delete "$RELEASE_BRANCH"
          else
            echo "Keeping release branch: no merged PR found or a release PR is still open."
          fi
