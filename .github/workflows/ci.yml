name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, typecheck, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        if: github.head_ref == 'changeset-release/main'
        run: pnpm build

      - name: Build hooks for tests
        if: github.head_ref != 'changeset-release/main'
        run: pnpm --filter @wpxdev/hooks exec tsup src/autosave.ts --format esm --external react

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Test packages
        run: pnpm test

  changeset:
    name: Require changeset for package changes
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for Dependabot changeset
        if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in {1..30}; do
            git fetch origin "$PR_BRANCH"
            if git cat-file -e "FETCH_HEAD:.changeset/dependabot-${PR_NUMBER}.md" 2>/dev/null; then
              git checkout --detach FETCH_HEAD
              exit 0
            fi
            sleep 5
          done
          echo "Dependabot changeset was not generated in time"
          exit 1

      - name: Check changeset status
        run: pnpm changeset:status
